name: Build unsigned Windows portable

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Build ScrollScreen (unsigned)
        shell: pwsh
        run: |
          $env:GO111MODULE='off'
          $env:GOOS='windows'
          $env:GOARCH='amd64'
          go build -trimpath -ldflags='-H=windowsgui -s -w' -o ScrollScreen.exe main.go

      - name: Upload unsigned test build
        uses: actions/upload-artifact@v4
        with:
          name: ScrollScreen-windows-amd64-UNSIGNED
          path: ScrollScreen.exe
